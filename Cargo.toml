[workspace]
resolver = "2"
default-members = ["crates/agendao"]
members = [
    "crates/agendao",
    "crates/agendao-api",
    "crates/agendao-launcher",
    "crates/agendao-client",
    "crates/agendao-core",
    "crates/agendao-output-blocks",
    "crates/agendao-command-render",
    "crates/agendao-types",
    "crates/agendao-util",
    "crates/agendao-multimodal",
    "crates/agendao-config",
    "crates/agendao-grep",
    "crates/agendao-permission",
    "crates/agendao-provider",
    "crates/agendao-sandbox",
    "crates/agendao-state",
    "crates/agendao-runtime-context",
    "crates/agendao-memory",
    "crates/agendao-execution-types",
    "crates/agendao-session",
    "crates/agendao-skill",
    "crates/agendao-storage",
    "crates/agendao-tool-core",
    "crates/agendao-tool",
    "crates/agendao-tool-web",
    "crates/agendao-agent",
    "crates/agendao-server-core",
    "crates/agendao-server-pty",
    "crates/agendao-server",
    "crates/agendao-lsp",
    "crates/agendao-mcp",
    "crates/agendao-cli-core",
    "crates/agendao-cli",
    "crates/agendao-command",
    "crates/agendao-plugin",
    "crates/agendao-orchestrator",
    "crates/agendao-tui-revue",
]

[workspace.package]
version = "2026.8.24"
edition = "2021"
authors = ["Biocheming"]
license = "MIT"

[profile.dev]
debug = 0

[profile.release]
strip = "debuginfo"
lto = "thin"
codegen-units = 1
debug = 0

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"
parking_lot = "0.12"
regex = "1"
glob = "0.3"
dirs = "6"
async-trait = "0.1"
futures = "0.3"
url = "2.5"
sha2 = "0.10"
base64 = "0.22"
# tokio intentionally carries no features here: member crates enable only the
# features they need (additive on top of `workspace = true`), so the unified
# build gets the union instead of "full".
tokio = "1"
# Shared reqwest baseline: every member disables default features and uses
# rustls with webpki roots; crate-specific extras (json, blocking, stream,
# charset, http2, system-proxy) stay in the member manifests.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
clap = { version = "4", features = ["derive"] }
axum = "0.8"
ratatui = "0.30.0"
crossterm = { version = "0.29.0", features = ["event-stream"] }

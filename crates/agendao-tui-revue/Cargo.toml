[package]
name = "agendao-tui-revue"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "AgenDao TUI frontend built with Revue — Vue-style reactive terminal UI"

[dependencies]
agendao-util = { path = "../agendao-util" }
revue = { path = "../../../revue", features = ["markdown"] }
agendao-client = { path = "../agendao-client" }
agendao-orchestrator = { path = "../agendao-orchestrator" }
agendao-command = { path = "../agendao-command" }
agendao-server-core = { path = "../agendao-server-core" }
agendao-types = { path = "../agendao-types" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync"] }
tokio-util = { version = "0.7", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
base64 = "0.22"
dirs = "6"
unicode-width = "0.1"
futures = "0.3"
reqwest = { workspace = true, features = ["json"] }
reqwest-eventsource = "0.6"
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
agendao-server = { path = "../agendao-server", default-features = false, features = ["http", "mcp"] }
agendao-state = { path = "../agendao-state" }
agendao-config = { path = "../agendao-config" }
agendao-runtime-context = { path = "../agendao-runtime-context" }
ratatui = "0.29"
ratatui-markdown = { version = "0.3.6", default-features = false, features = ["markdown"] }

[features]
default = ["local-server"]
local-server = ["dep:tokio-util"]

[dev-dependencies]
tempfile = "3"

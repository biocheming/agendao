[package]
name = "agendao"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
default-run = "agendao"

[features]
default = ["product-shell"]
product-shell = [
    "dep:agendao-cli",
    # LSP stays out of the product until server startup owns and injects an
    # LspClientRegistry. Enabling the compile-time feature alone is not a runtime connection.
    "agendao-cli/run-core",
    "agendao-cli/run-remote-stream",
    "agendao-cli/local-server",
    "dep:agendao-client",
    "dep:agendao-launcher",
    "agendao-launcher/embedded-web",
    "dep:agendao-server",
    "agendao-server/http",
    "agendao-server/ws",
    "agendao-server/pty",
    "agendao-server/mcp",
    "dep:agendao-tui-revue",
    "agendao-tui-revue/local-server",
    "dep:clap",
    "dep:reqwest",
    "dep:tracing-subscriber",
    "dep:which",
]
product-cli-bin = [
    "dep:agendao-cli",
    "agendao-cli/run-core",
    "agendao-cli/run-remote-stream",
    "agendao-cli/local-server",
    "dep:tracing-subscriber",
]
product-serve-bin = [
    "dep:agendao-launcher",
    "agendao-launcher/embedded-web",
    "dep:agendao-server",
    "agendao-server/http",
    "agendao-server/ws",
    "agendao-server/pty",
    "agendao-server/mcp",
    "dep:clap",
    "dep:tracing-subscriber",
]

[[bin]]
name = "agendao"
path = "src/main.rs"
required-features = ["product-shell"]

[[bin]]
name = "agendao-product-cli"
path = "src/bin/agendao-product-cli.rs"
required-features = ["product-cli-bin"]

[[bin]]
name = "agendao-product-serve"
path = "src/bin/agendao-product-serve.rs"
required-features = ["product-serve-bin"]

[dependencies]
mimalloc = { version = "0.1", default-features = false }
agendao-util = { path = "../agendao-util" }
agendao-cli = { path = "../agendao-cli", optional = true, default-features = false }
agendao-client = { path = "../agendao-client", optional = true }
agendao-launcher = { path = "../agendao-launcher", optional = true }
agendao-server = { path = "../agendao-server", optional = true, default-features = false }
agendao-tui-revue = { path = "../agendao-tui-revue", optional = true, default-features = false }
tokio = { workspace = true, features = ["macros", "process", "rt", "rt-multi-thread", "time"] }
anyhow = { workspace = true }
clap = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true, default-features = false, features = ["charset", "http2", "json", "system-proxy"] }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter"] }
which = { version = "7", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[package]
name = "agendao-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
autobins = false

[features]
default = ["run-core", "run-remote-stream", "local-server", "db", "lsp", "memory"]
run-core = []
run-remote-stream = [
    "run-core",
    "dep:agendao-api",
    "dep:agendao-command-render",
    "dep:agendao-server-core",
]
local-server = ["dep:agendao-server", "run-remote-stream"]
db = ["session-db", "proposal-db", "memory-db"]
session-db = ["dep:agendao-storage"]
proposal-db = ["dep:agendao-storage"]
memory-db = ["dep:agendao-storage"]
lsp = ["dep:agendao-lsp", "agendao-tool/lsp"]
memory = ["dep:agendao-memory"]

[dependencies]
agendao-core = { path = "../agendao-core", features = ["process-registry"] }
agendao-cli-core = { path = "../agendao-cli-core" }
agendao-orchestrator = { path = "../agendao-orchestrator" }
agendao-util = { path = "../agendao-util" }
agendao-config = { path = "../agendao-config" }
agendao-grep = { path = "../agendao-grep" }
agendao-agent = { path = "../agendao-agent" }
agendao-execution-types = { path = "../agendao-execution-types" }
agendao-client = { path = "../agendao-client" }
agendao-server = { path = "../agendao-server", optional = true }
agendao-memory = { path = "../agendao-memory", optional = true }
agendao-provider = { path = "../agendao-provider" }
agendao-plugin = { path = "../agendao-plugin" }
agendao-runtime-context = { path = "../agendao-runtime-context" }
agendao-session = { path = "../agendao-session" }
agendao-skill = { path = "../agendao-skill" }
agendao-storage = { path = "../agendao-storage", optional = true }
agendao-state = { path = "../agendao-state" }
agendao-tool = { path = "../agendao-tool" }
agendao-types = { path = "../agendao-types" }
agendao-sandbox = { path = "../agendao-sandbox" }
agendao-command-render = { path = "../agendao-command-render", optional = true }
agendao-api = { path = "../agendao-api", optional = true }
agendao-server-core = { path = "../agendao-server-core", optional = true }
agendao-lsp = { path = "../agendao-lsp", optional = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
anyhow = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
jsonc-parser = { version = "0.29.0", features = ["serde"] }
reqwest = { workspace = true, features = ["charset", "http2", "json", "system-proxy"] }
chrono = { workspace = true }
dirs = { workspace = true }
url = { workspace = true }

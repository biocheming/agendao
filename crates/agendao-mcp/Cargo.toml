[package]
name = "agendao-mcp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
agendao-core = { path = "../agendao-core", features = ["event-bus", "subprocess-runtime", "process-registry"] }
agendao-sandbox = { path = "../agendao-sandbox" }
agendao-util = { path = "../agendao-util" }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true, features = ["charset", "http2", "stream", "system-proxy"] }
reqwest-eventsource = "0.6"
oauth2 = { version = "5", default-features = false, features = ["reqwest", "rustls-tls"] }
chrono = { workspace = true }

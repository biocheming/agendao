[package]
name = "agendao-command-render"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = ["terminal-ui", "block-projection"]
terminal-ui = ["agendao-command/terminal-ui"]
runtime-hooks = ["terminal-ui", "agendao-command/runtime-hooks"]
block-projection = ["terminal-ui", "agendao-command/block-projection"]

[dependencies]
agendao-command = { path = "../agendao-command", default-features = false }
agendao-output-blocks = { path = "../agendao-output-blocks" }
